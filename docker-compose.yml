---
services:
  elasticsearch:
    image: jahrik/arm-elasticsearch:latest
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - /data:/usr/share/elasticsearch/data:rw
    networks:
      - elk
    deploy:
      resources:
        limits:
          memory: 1.5G

networks:
  elk:
    name: elk
    driver: overlay
    external: true
